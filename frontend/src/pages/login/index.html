<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OneView</title>
    <link rel="stylesheet" type="text/css" href="login.css" />
    <link rel="stylesheet" type="text/css" href="../../styles/theme.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="../../components/titlebar/titlebar.css"
    />
    <script type="module" src="login.js"></script>
  </head>

  <body>
    <div class="drag-box"></div>
    <div id="app-root">
      <div id="force-update-overlay" class="force-update-overlay hidden" aria-live="polite">
        <div class="force-update-modal">
          <div class="force-update-eyebrow">Required update</div>
          <h2 id="force-update-title">Downloading required update</h2>
          <p id="force-update-message">
            A mandatory OneView update is available. Sign-in is blocked until the latest build finishes downloading.
          </p>
          <div id="force-update-progress" class="force-update-progress hidden"></div>
        </div>
      </div>
      <div class="titlebar" role="toolbar" aria-hidden="false">
        <button
          id="min-btn"
          class="no-drag action-btn"
          aria-label="Minimize"
          title="Minimize"
        ></button>
        <button
          id="max-btn"
          class="no-drag action-btn"
          aria-label="Maximize"
          title="Maximize"
        ></button>
        <button
          id="close-btn"
          class="no-drag action-btn"
          aria-label="Close"
          title="Close"
        ></button>
      </div>
      <div class="login-container">
        <img class="logo" src="/assets/WPP_Production_White.svg" alt="WPP Production Logo" />
        
        <!-- Persisted login UI -->
        <div id="persisted-login-container" class="hidden">
          <div class="persisted-user-info">
            <span id="persisted-username-display"></span>
          </div>
          <button type="button" id="login-persisted" class="login">Login</button>
          <button type="button" id="login-other-user" class="login secondary">Login with another user</button>
        </div>
        
        <!-- Regular login form -->
        <form id="login-form">
          <label for="username">Employee ID</label>
          <input type="text" id="username" name="username" required />
          <br />
          <label for="password">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="password" name="password" required />
            <button
              type="button"
              id="login-password-toggle"
              class="password-toggle-btn"
              aria-label="Show password"
              title="Show password"
            >
              <span class="password-toggle-icon password-toggle-icon-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M2.25 12S5.625 5.25 12 5.25 21.75 12 21.75 12 18.375 18.75 12 18.75 2.25 12 2.25 12Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                  />
                </svg>
              </span>
              <span class="password-toggle-icon password-toggle-icon-hide" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M3 3L21 21"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="1.75"
                  />
                  <path
                    d="M10.584 10.587A2.999 2.999 0 0 0 12 15a2.999 2.999 0 0 0 2.414-4.794"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                  <path
                    d="M9.878 5.124A10.94 10.94 0 0 1 12 5.25c6.375 0 9.75 6.75 9.75 6.75a16.557 16.557 0 0 1-4.293 5.059M6.228 6.228C3.977 7.756 2.75 12 2.75 12s3.375 6.75 9.25 6.75a10.96 10.96 0 0 0 5.022-1.228"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                </svg>
              </span>
            </button>
          </div>
          <br />
          <button type="submit" class="login">Login</button>
          <button type="button" id="forgot-password-btn" class="forgot-password login">Forgot password?</button>
          <button type="button" id="guest-button" class="hidden login">
            Login as guest
          </button>
        </form>
        
        <!-- Forgot Password form -->
        <form id="forgot-password-form" class="hidden">
          <label for="forgot-employee-id">Employee ID</label>
          <input type="text" id="forgot-employee-id" name="forgot-employee-id" required />
          <!-- <br /> -->
          <label for="forgot-new-password">New Password</label>
          <div class="password-input-wrap">
            <input type="password" id="forgot-new-password" name="forgot-new-password" required />
            <button
              type="button"
              id="forgot-password-toggle"
              class="password-toggle-btn"
              aria-label="Show password"
              title="Show password"
            >
              <span class="password-toggle-icon password-toggle-icon-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M2.25 12S5.625 5.25 12 5.25 21.75 12 21.75 12 18.375 18.75 12 18.75 2.25 12 2.25 12Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                  />
                </svg>
              </span>
              <span class="password-toggle-icon password-toggle-icon-hide" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M3 3L21 21"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="1.75"
                  />
                  <path
                    d="M10.584 10.587A2.999 2.999 0 0 0 12 15a2.999 2.999 0 0 0 2.414-4.794"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                  <path
                    d="M9.878 5.124A10.94 10.94 0 0 1 12 5.25c6.375 0 9.75 6.75 9.75 6.75a16.557 16.557 0 0 1-4.293 5.059M6.228 6.228C3.977 7.756 2.75 12 2.75 12s3.375 6.75 9.25 6.75a10.96 10.96 0 0 0 5.022-1.228"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                </svg>
              </span>
            </button>
          </div>
          <!-- <br /> -->
          <label for="forgot-confirm-password">Confirm Password</label>
          <div class="password-input-wrap">
            <input type="password" id="forgot-confirm-password" name="forgot-confirm-password" required />
            <button
              type="button"
              id="forgot-confirm-password-toggle"
              class="password-toggle-btn"
              aria-label="Show password"
              title="Show password"
            >
              <span class="password-toggle-icon password-toggle-icon-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M2.25 12S5.625 5.25 12 5.25 21.75 12 21.75 12 18.375 18.75 12 18.75 2.25 12 2.25 12Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                  />
                </svg>
              </span>
              <span class="password-toggle-icon password-toggle-icon-hide" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M3 3L21 21"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="1.75"
                  />
                  <path
                    d="M10.584 10.587A2.999 2.999 0 0 0 12 15a2.999 2.999 0 0 0 2.414-4.794"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                  <path
                    d="M9.878 5.124A10.94 10.94 0 0 1 12 5.25c6.375 0 9.75 6.75 9.75 6.75a16.557 16.557 0 0 1-4.293 5.059M6.228 6.228C3.977 7.756 2.75 12 2.75 12s3.375 6.75 9.25 6.75a10.96 10.96 0 0 0 5.022-1.228"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.75"
                  />
                </svg>
              </span>
            </button>
          </div>
          <br />
          <button type="submit" class="login">Reset Password</button>
          <button type="button" id="back-to-login-btn" class="login secondary">Back to Login</button>
        </form>
      </div>
      <div class="connection-status" id="connection-status">
        Checking VPN connection...
      </div>
      <div id="toast-container"></div>
    </div>
  </body>
</html>
