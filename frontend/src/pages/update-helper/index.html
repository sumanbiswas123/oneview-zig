<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneView Updater</title>
  <link rel="stylesheet" href="../../styles/fonts.css" />
  <link rel="stylesheet" href="update-helper.css" />
</head>

<body>
  <main class="helper-shell">
    <section class="helper-card">
      <div class="hero-orbit" aria-hidden="true">
        <div class="orbit-ring orbit-ring-a"></div>
        <div class="orbit-ring orbit-ring-b"></div>
        <div class="orbit-core">
          <span>OV</span>
        </div>
      </div>

      <div class="helper-copy">
        <div id="helperEyebrow" class="helper-eyebrow">Preparing update</div>
        <h1 id="helperTitle">Getting OneView ready to update</h1>
        <p id="helperMessage">
          Please keep this window open. We will stay here while the update finishes and close only after OneView launches again.
        </p>
      </div>

      <div class="helper-status-panel">
        <div class="helper-status-header">
          <span id="helperPhaseLabel">Stand by</span>
          <span id="helperVersion" class="helper-version"></span>
        </div>
        <div class="helper-progress" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div id="helperDetail" class="helper-detail">
          Waiting for the installer handoff.
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="update-helper.js"></script>
</body>

</html>
