<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Mode Runner</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../styles/theme.css" />
    <link rel="stylesheet" href="dev-runner.css" />
  </head>
  <body>
    <div class="title-bar">
      <div class="title-bar-left">
        <span class="badge-dev">DEV MODE</span>
        <span class="title-label">App Store Runner</span>
        <span id="url-display" style="color: #666; margin-left: 10px"
          >Connectng...</span
        >
      </div>
      <div class="window-controls">
        <button
          class="control-btn"
          id="btn-inspect"
          title="Inspect App (F12 / Ctrl+Shift+I)"
        >
          <i class="bi bi-search"></i>
        </button>
        <button class="control-btn" id="btn-refresh" title="Refresh">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="control-btn" id="btn-minimize">
          <i class="bi bi-dash-lg"></i>
        </button>
        <button class="control-btn" id="btn-maximize">
          <i class="bi bi-stop"></i>
        </button>
        <button class="control-btn close-btn" id="btn-close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <div id="loading">
      <h2>Dev Mode</h2>
      <p>Connecting to dev server...</p>
    </div>

    <!-- Webview will be configured by script -->
    <div id="dev-webview" class="dev-webcontent"></div>

    <script type="module" src="dev-runner.js"></script>
  </body>
</html>
