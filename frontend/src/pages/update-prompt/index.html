<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Install Update</title>
  <link rel="stylesheet" href="../../styles/fonts.css" />
  <link rel="stylesheet" href="../../styles/theme.css" />
  <link rel="stylesheet" href="update-prompt.css" />
</head>

<body>
  <div class="prompt-shell">
    <div id="promptCard" class="prompt-card">
      <div class="prompt-badge">Update Ready</div>
      <h1>Install the latest version now?</h1>
      <p id="updatePromptMessage">
        A new version has been downloaded and is ready to install.
      </p>
      <div class="prompt-actions">
        <button id="updatePromptLaterBtn" class="prompt-btn prompt-btn-secondary" type="button">
          Later
        </button>
        <button id="updatePromptInstallBtn" class="prompt-btn prompt-btn-primary" type="button">
          Restart & Install
        </button>
      </div>
    </div>
  </div>
  <script type="module" src="update-prompt.js"></script>
</body>

</html>
