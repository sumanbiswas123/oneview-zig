<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneView Store</title>
    <!-- Preload fonts if possible, or link to fonts.css -->
    <!-- Vanilla Tilt for 3D effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script type="module" crossorigin src="../../assets/appstore-BoIirHpB.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="../../assets/external-exe-DRsy67iY.js">
    <link rel="modulepreload" crossorigin href="../../assets/app-env-Dw5Rxq_p.js">
    <link rel="modulepreload" crossorigin href="../../assets/app-runtime-CuOCpSBc.js">
    <link rel="modulepreload" crossorigin href="../../assets/app-update-notifications-DQcYLNxX.js">
    <link rel="stylesheet" crossorigin href="../../assets/fonts-BcjOJJ5T.css">
    <link rel="stylesheet" crossorigin href="../../assets/theme-CSaJxSlh.css">
    <link rel="stylesheet" crossorigin href="../../assets/appstore-DyNV37Mv.css">
  </head>
  <body>
    <!-- Background Layers -->
    <div class="ambient-light"></div>
    <div class="aurora-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="app-layout">
      <!-- Main Scrollable Area -->
      <main class="main-content">
        <!-- Top bar removed - using dashboard's navbar instead -->

        <!-- View Toggle with Category Filters -->
        <div class="view-toggle-container">
          <!-- Category Filters (Left Side) -->
          <div class="category-filters">
            <button class="filter-btn active" data-cat="all" title="All Apps">
              All
            </button>
            <button class="filter-btn" data-cat="eDA" title="eDA">eDA</button>
            <button class="filter-btn" data-cat="web" title="Web">Web</button>
            <button class="filter-btn" data-cat="email" title="Email">
              Email
            </button>
            <button class="filter-btn" data-cat="creative" title="Creative">
              Creative
            </button>
          </div>

          <button id="createDevProjectBtn" class="create-dev-btn" style="display: none">
            Create Dev Project
          </button>
        </div>

        <!-- Grid Section -->
        <section class="apps-section">
          <div class="section-header">
            <h2 id="availableGridHeader">Available Apps</h2>
            <div class="filter-tabs">
              <!-- Additional filters can go here -->
            </div>
          </div>

          <div class="masonry-grid" id="appsGridAvailable">
            <!-- Apps injected via JS -->
            <div class="loader-skeleton">
              <div class="sk-card"></div>
              <div class="sk-card"></div>
              <div class="sk-card"></div>
            </div>
          </div>
        </section>

        <section class="apps-section installed-section">
          <div class="section-header">
            <h2 id="installedGridHeader">Installed Apps</h2>
          </div>

          <div class="masonry-grid" id="appsGridInstalled"></div>
        </section>
      </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Full Screen Search Overlay -->
    <div id="searchModal" class="search-overlay">
      <div class="search-modal-glass">
        <div class="search-input-wrapper">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="search-icon-lg"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search for anything..."
            autocomplete="off"
          />
          <button class="close-search" id="closeSearchBtn">✕</button>
        </div>
        <div class="search-results-container" id="searchResults">
          <!-- Results -->
        </div>
        <div class="search-footer">
          <span>Nav <kbd>↓</kbd> <kbd>↑</kbd></span>
          <span>Select <kbd>Enter</kbd></span>
          <span>Close <kbd>Esc</kbd></span>
        </div>
      </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div
      id="customModal"
      class="custom-modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="customModalTitle"
      aria-describedby="customModalMessage"
    >
      <div class="custom-modal-glass">
        <button
          id="customModalClose"
          class="custom-modal-close"
          aria-label="Close"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div
          class="modal-icon-wrap"
          id="customModalIconWrap"
          aria-hidden="true"
        >
          <div class="modal-icon" id="customModalIcon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <circle cx="12" cy="16" r="1"></circle>
            </svg>
          </div>
        </div>
        <h3 id="customModalTitle" class="modal-title">Confirmation</h3>
        <p id="customModalMessage" class="modal-message">
          Are you sure you want to proceed?
        </p>
        <p id="customModalHint" class="modal-hint"></p>
        <div class="custom-modal-actions">
          <button id="customModalCancel" class="modal-btn ghost">Cancel</button>
          <button id="customModalConfirm" class="modal-btn primary">
            Confirm
          </button>
        </div>
      </div>
    </div>

  </body>
</html>
