<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Runner</title>
    <script type="module" crossorigin src="../../assets/runner-DOSAkqJ4.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="../../assets/titlebar-Dccu27MD.js">
    <link rel="modulepreload" crossorigin href="../../assets/app-env-Dw5Rxq_p.js">
    <link rel="modulepreload" crossorigin href="../../assets/app-runtime-CuOCpSBc.js">
    <link rel="modulepreload" crossorigin href="../../assets/webcontent-client-DJU5VCvB.js">
    <link rel="modulepreload" crossorigin href="../../assets/external-exe-DRsy67iY.js">
    <link rel="stylesheet" crossorigin href="../../assets/runner-BKkRDrX3.css">
    <link rel="stylesheet" crossorigin href="../../assets/fonts-BcjOJJ5T.css">
    <link rel="stylesheet" crossorigin href="../../assets/theme-CSaJxSlh.css">
  </head>
  <body>
    <!-- Background Effects -->
    <div class="ambient-light"></div>
    <div class="aurora-overlay"></div>
    <div class="noise-overlay"></div>
    <!-- Unified Browser Toolbar -->
    <div class="browser-toolbar">
      <div class="drag-region"></div>
      <!-- Custom drag region behind controls -->

      <div class="toolbar-left">
        <button id="home-btn" class="nav-btn" title="Back to Dashboard">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </button>

        <div class="nav-group">
          <button id="back-btn" class="nav-btn" disabled title="Go Back">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <button id="fwd-btn" class="nav-btn" disabled title="Go Forward">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
          <button id="reload-btn" class="nav-btn" title="Reload">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M23 4v6h-6" />
              <path d="M1 20v-6h6" />
              <path
                d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar-center">
        <div class="address-bar">
          <span class="folder-icon">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              />
            </svg>
          </span>
          <input
            type="text"
            id="url-input"
            class="url-input"
            value="Initializing..."
            readonly
          />
          <span class="security-badge">
            <svg
              width="10"
              height="10"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            Local
          </span>
        </div>
      </div>

      <div class="toolbar-right">
        <button id="fullscreen-btn" class="nav-btn" title="Toggle Fullscreen">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
            />
          </svg>
        </button>

        <div class="window-controls">
          <button
            id="max-btn"
            class="window-action-btn"
            title="Maximize"
            aria-label="Maximize"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
          </button>
          <button
            id="close-btn"
            class="window-action-btn close-action-btn"
            title="Close"
            aria-label="Close"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="runner-viewport">
      <!-- Loader Overlay -->
      <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <p id="loading-text">Loading App...</p>
      </div>

      <div id="app-view" class="app-webcontent"></div>
    </div>

    <!-- Browser Footer Status Bar -->
    <footer class="browser-status-bar">
      <div class="status-left">
        <span class="rocket-icon" aria-hidden="true">Launch</span>
        <span id="status-text-left">Running Extension: bgpatcher</span>
      </div>
      <div class="status-right">
        <span id="status-zoom">100%</span>
        <span id="status-text-right">Running Extension: bgpatcher</span>
      </div>
    </footer>

  </body>
</html>
